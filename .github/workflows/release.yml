name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux-amd64:
    name: Build Linux amd64 package
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          major=$(sed -nE 's/^set\(VERSION_MAJOR "?([0-9]+)"?\).*/\1/p' CMakeLists.txt)
          minor=$(sed -nE 's/^set\(VERSION_MINOR "?([0-9]+)"?\).*/\1/p' CMakeLists.txt)
          patch=$(sed -nE 's/^set\(VERSION_PATCH "?([0-9]+)"?\).*/\1/p' CMakeLists.txt)
          version="${major}.${minor}.${patch}"
          test "${RELEASE_TAG}" = "v${version}" || {
            echo "Tag ${RELEASE_TAG} does not match CMake version v${version}" >&2
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            clang \
            clang-tidy \
            cmake \
            dpkg-dev \
            git \
            libcurl4-gnutls-dev \
            libncurses-dev \
            libssl-dev \
            libxml2-dev \
            ninja-build \
            ocaml-interp \
            opam \
            pkg-config \
            python3 \
            python3-pip \
            time \
            zlib1g-dev
          python3 -m pip install --user pygments

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTOOLS_BUILD_TYPE=Release \
            -DLIBS_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Create Debian package
        shell: bash
        run: |
          set -euo pipefail
          cd build/packages
          bash ./generate_package.sh deb ubuntu-22.04 amd64
          mkdir -p ../../dist
          mv ./*.deb ../../dist/
          cd ../../dist
          sha256sum ./*.deb > SHA256SUMS
          dpkg-deb --info ./*.deb

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: flon-cdt-linux-amd64-${{ env.RELEASE_TAG }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build-linux-amd64
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: flon-cdt-linux-amd64-${{ env.RELEASE_TAG }}
          path: dist

      - name: Create or update release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --generate-notes \
              --title "FLON CDT ${RELEASE_TAG}"
          fi
